name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Principe du moindre privilège : lecture seule par défaut
permissions:
  contents: read

jobs:
  lint-dockerfile:
    name: Lint Dockerfile (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historique complet, pour détecter aussi les secrets d'anciens commits
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint-dockerfile, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: secure-app:ci
      - name: Smoke test
        run: |
          docker run -d --name app -p 5000:5000 secure-app:ci
          sleep 5
          curl --fail http://localhost:5000/health
          docker rm -f app
